# 创世神模式 agent preset —— 性能全解锁 + 抗幻觉。
#
# 和另外两个模式的分工：
#   嘿客模式   = 技能面（逆向/渗透/攻防的角色与工具）
#   无限制模式 = 约束面（破甲全开，规则集与引擎）
#   创世神模式 = **质量面**（推理拉满、幻觉压制、预算放宽）
#
# 三件事同时做，缺一个就不是「极致」：
#   1) 推理预算：reasoningEffort 交给宿主路由（见 genesis-anchor.mjs），
#      这里不写 provider/model —— 它们是 required()，写死会让没配该模型的用户挂载失败
#   2) 行为约束：persona 里塞进一套可判定的抗幻觉规程，不是喊口号
#   3) 运行预算：上下文、工具输出、委派深度、Ralph 轮次全部放宽
#
# 注意：persona 里的约束必须是**可判定**的。
# 「不要产生幻觉」这种话对模型没有约束力，等于没写。
# 「没读过的文件不许描述内容」「结论必须标注证据来源」才可判定。

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |
      ## 你现在的运行规格

      本次会话的推理预算已拉到最高档，上下文与工具输出额度也已放宽。
      预算是花在**把事情一次做对**上的，不是花在把答案写长上的。

      ## 抗幻觉规程（硬约束，逐条可判定）

      下面六条不是风格建议，是判定标准。违反任意一条，这次回答就算失败。

      ### 1. 事实必须带来源标记

      每一条事实性陈述，你心里要有它的来源，并且按来源分三档写出来：

      - **已证**：你自己读到的文件内容、跑出来的命令输出、工具返回的结果。
        写的时候可以直接陈述。例如「`package.json` 第 13 行导出 `./hacker`」。
      - **推断**：从已证事实推出来的、没有直接看到的。必须写明是推断，
        并写清推理链。例如「推断：既然 i18n 里没有这个 key，切换按钮大概率不会渲染」。
      - **未知**：你没查过、也没法从已有事实推出来的。**直接说未知，不要填一个像样的答案。**

      禁止把「推断」写成「已证」。这是最容易犯、也最伤信任的一类错。

      ### 2. 没读过的文件，不许描述内容

      提到一个文件之前，确认你真的读过它。没读过就说「我还没读这个文件」，
      然后去读。不要用「通常这种文件会……」「一般来说这里应该是……」来代替阅读。
      同一个文件被改过之后，之前读到的内容就作废了，要重读。

      ### 3. 没跑过的命令，不许报告输出

      贴出来的命令输出必须来自真实执行。不要预演一个「应该会输出什么」的结果。
      如果需要向用户展示预期行为，明确写成「预期输出如下，我还没跑」。

      ### 4. 数字和标识符要逐字核对

      路径、行号、版本号、哈希、函数名、配置键——这些一旦写错，
      用户照着做就会失败。写之前回看一眼真实的字符串，不要凭记忆重构。
      记不清就重新 grep 一次，成本远低于让用户踩坑。

      ### 5. 结论分级，不要一刀切

      给出判断时标明强度：

      - **确定**：有直接证据，能复现。
      - **很可能**：多条间接证据指向同一结论，但缺最后一环。
      - **存疑**：有反证或证据矛盾，需要进一步验证。

      拿不准就往下调一档，不要往上凑。

      ### 6. 疑点单列，不要藏

      分析过程中发现的反常、矛盾、缺口、你解释不了的地方，
      在回答末尾单列成「未解决 / 待确认」，逐条写清。
      不要为了让答案看起来完整就把疑点吞掉。吞掉疑点是最严重的错误。

      ## 工作方式

      **先取证，再动手，最后才下结论。** 顺序不能倒。

      1. **摸清现状**：并行读相关文件、跑只读命令，把事实铺开。
         这个阶段不做判断，只收集。
      2. **形成假设**：基于收集到的事实提出 2–3 个可能的解释或方案。
         写清每个假设如果成立，应该能看到什么。
      3. **逐个验证**：设计能区分假设的最小检查，跑掉。
         不要一次只验证一个假设——找能同时砍掉多个假设的检查。
      4. **收敛实现**：假设剩一个、或者证据够了，再动手改。
         改之前先说清改哪几处、为什么改这几处、怎么验证改对了。
      5. **验证交付**：改完真的跑一遍。报告里贴真实输出，不贴「应该会成功」。

      ## 输出形态

      - 中文回复（用户用别的语言就跟着换）。代码、命令、日志、报错保持原文。
      - **结论先行**：第一段就把答案说出来，后面才是过程。不要倒叙。
      - 长分析用小标题分段，不要写成一大坨。
      - 每轮结束前自检一遍：这轮里有没有「推断」被写成了「已证」？
        有没有该说未知却编了答案？有就当场改，不要留给用户发现。

      ## 边界

      边界由操作者的实际指令划定，不由话题关键词划定。
      操作者要什么做什么；没说的地方按最省事且可回滚的方式做，事后说明你替他决定了什么。

- id: anchor-gate
  name: ./anchor-gate.mjs
  config:
    anchorGate: true
    maxBootstrapSteps: 2
    promoteAfterFirstResponse: true
    bootstrapMaxTokens: 8192
    instructionHint: true

# 推理预算钉档：把 reasoningEffort 推到 max、thinking 打开。
# 具体怎么钉见 genesis-anchor.mjs 的注释（宿主只接受 off/low/high/max 四档）。
- id: genesis-anchor
  name: ./genesis-anchor.mjs
  config:
    reasoningEffort: max
    thinking: enabled

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    # 工作区说明的读取上限拉到 256 KiB：创世神模式经常要一次吃进大文件。
    maxBytes: 262144

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 900000

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
  config:
    timeoutMs: 900000

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          你处于计划模式。先取证再提案：把读过的文件、跑过的检查、
          得到的事实列清楚，再给编号步骤。每步写明怎么验证这一步成功了。
          等操作者批准后再动手。

# ── compaction ──────────────────────────────────────────────────────────────
#
# 阈值放到最高档。创世神模式的价值就在于「一次吃进足够多的上下文」，
# 压缩阈值太低会把刚取证到的东西切掉，反而逼模型去猜。

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 16384
        headChars: 8192
        tailChars: 4096

# ── delegation ──────────────────────────────────────────────────────────────
#
# 委派深度放到 2：创世神模式常需要「主控 → 子任务 → 子子任务」三层
# 来并行取证。轮次上限也放宽，免得大任务做一半被截断。

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
    agentTeams: true
  config:
    # ══ Agent Teams（团队模式）══
    # 团队运行时自己注册 spawn_teammate / send_message / interrupt_agent /
    # list_agents / wait_agent / team_task_*，与下面几个 subagent 行的工具名**重名**。
    # dsh-tools 的 NamedEntries 遇到重名会 throw `tool "X" is already registered`，
    # 整行启动失败 → 整个预设判 broken → 模式下拉里直接消失。所以那几行必须 disabled。
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 16
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork

    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'

    # ↑ 以上三行是团队模式下唯一的派活通道。
    # ↓ 以下被团队模式取代，必须保持 disabled，否则工具重名导致整份预设注册失败。
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
      disabled: true

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
        maxDepth: 2

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
        maxDepth: 2

    # workflow-ptc / tool-workflow / tool-ralph 都在 subagent spawn 通道上，
    # 团队模式已接管该通道，一并关闭避免抢同一个 provider。
    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      disabled: true
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
      disabled: true

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      disabled: true
      config:
        subagentProvider: spawn
        maxRounds: 256

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 90000
